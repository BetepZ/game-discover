{% extends "base.html" %}
{% block title %}Login - Game Discover{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="card-body p-4">
    <h3 class="mb-1">🎮 Game Discover</h3>
    <p class="text-body-secondary">Masuk untuk melihat rekomendasi game.</p>
    {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 mb-0 small">Belum punya akun? <a href="/register">Daftar</a></p>
  </div>
</div>
{% endblock %}
