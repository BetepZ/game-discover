<!doctype html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Game Discover{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
{% set path = request.url.path %}
{% if user %}
<nav class="navbar navbar-expand-md border-bottom sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">🎮 Game Discover</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {{ 'active' if path == '/' }}" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if path == '/library' }}" href="/library">My Library</a></li>
      </ul>
      <span class="navbar-text me-3">👤 {{ user.username }}</span>
      <a class="btn btn-outline-secondary btn-sm" href="/logout">Logout</a>
    </div>
  </div>
</nav>
{% endif %}
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
